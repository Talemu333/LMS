name: CI

on:
  push:
  pull_request:

jobs:
  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build client
        run: npm run build

  server-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check server modules
        run: node --check src/app.js && node --check src/routes/auth.js && node --check src/routes/student.js && node --check src/routes/instructor.js && node --check src/routes/assessments.js && node --check src/routes/admin.js
